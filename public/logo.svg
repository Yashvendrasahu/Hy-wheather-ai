<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background rounded gradient -->
    <linearGradient id="wfBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Fusion Sparkle Gradient -->
    <linearGradient id="wfFuseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="wfCloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="wfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0369A1" flood-opacity="0.35"/>
    </filter>
    <filter id="wfSparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Icon Squircle Container -->
  <rect x="10" y="10" width="180" height="180" rx="44" fill="url(#wfBgGrad)" filter="url(#wfGlow)"/>
  
  <!-- Outer Atmospheric Radar Rings -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2.5" stroke-dasharray="4 6"/>
  <circle cx="100" cy="100" r="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Sleek Storm Cloud Body -->
  <g filter="url(#wfGlow)">
    <path d="M64 126 C53 126 44 117 44 106 C44 96 52 87.5 62 86.5 C64.5 72 77 60 92 60 C106 60 118 70 121.5 83.5 C124 82.5 127 82 130 82 C142 82 152 92 152 104 C152 116 142 126 130 126 Z" 
          fill="url(#wfCloudGrad)"/>
  </g>

  <!-- Dynamic Fusion Lightning Pulse (FUSE Spark) -->
  <polygon points="106,86 86,118 104,118 96,152 124,110 106,110" 
           fill="url(#wfFuseGrad)" 
           filter="url(#wfSparkGlow)"/>

  <!-- Fusion Micro-Particles (Energy nodes) -->
  <circle cx="140" cy="74" r="4.5" fill="#FDE047" opacity="0.9"/>
  <circle cx="60" cy="144" r="3.5" fill="#38BDF8" opacity="0.8"/>
  <circle cx="146" cy="138" r="3" fill="#BAE6FD" opacity="0.75"/>
</svg>
